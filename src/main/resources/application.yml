server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: product-inventory-ai-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # En producción usar 'validate'; para desarrollo usar 'update'
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

# =============================================
# JWT
# =============================================
jwt:
  secret: ${JWT_SECRET:change-this-secret-key-in-production-must-be-at-least-256-bits}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}         # 1 hora
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 días

# =============================================
# AI Provider (proveedor agnóstico — base)
# =============================================
ai:
  provider:
    endpoint: ${AI_PROVIDER_ENDPOINT:}
    api-key: ${AI_PROVIDER_API_KEY:}
    model: ${AI_PROVIDER_MODEL:}

  # =============================================
  # Agent Levels — escalation: L1 → L2 → L3
  # Each level can override endpoint/key/model.
  # Falls back to ai.provider values if not set.
  # =============================================
  agents:
    levels:
      - name: L1
        endpoint: ${AI_AGENT_L1_ENDPOINT:${AI_PROVIDER_ENDPOINT:}}
        api-key: ${AI_AGENT_L1_API_KEY:${AI_PROVIDER_API_KEY:}}
        model: ${AI_AGENT_L1_MODEL:${AI_PROVIDER_MODEL:}}
        timeout-ms: 8000
        min-confidence: 0.75
        max-retries: 1
      - name: L2
        endpoint: ${AI_AGENT_L2_ENDPOINT:${AI_PROVIDER_ENDPOINT:}}
        api-key: ${AI_AGENT_L2_API_KEY:${AI_PROVIDER_API_KEY:}}
        model: ${AI_AGENT_L2_MODEL:${AI_PROVIDER_MODEL:}}
        timeout-ms: 20000
        min-confidence: 0.60
        max-retries: 2
      - name: L3
        endpoint: ${AI_AGENT_L3_ENDPOINT:${AI_PROVIDER_ENDPOINT:}}
        api-key: ${AI_AGENT_L3_API_KEY:${AI_PROVIDER_API_KEY:}}
        model: ${AI_AGENT_L3_MODEL:${AI_PROVIDER_MODEL:}}
        timeout-ms: 60000
        min-confidence: 0.0   # L3 is last resort — accept any result
        max-retries: 3

# =============================================
# RAG — Document processing
# =============================================
rag:
  chunk-size: 512          # characters per chunk
  chunk-overlap: 64        # overlap between chunks
  top-k-results: 5         # number of chunks to retrieve per query

# =============================================
# Agent Session (Caffeine in-memory cache)
# =============================================
agent:
  session:
    ttl-minutes: 30        # session expires after 30 min of inactivity
    max-sessions: 1000

# =============================================
# Image Storage
# =============================================
storage:
  image-path: ${IMAGE_STORAGE_PATH:./uploads}

# =============================================
# Springdoc / Swagger
# =============================================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  info:
    title: Product Inventory & Analytics API
    description: API REST para gestión de productos, catálogo y métricas de ventas con IA
    version: 1.0.0

# =============================================
# Logging
# =============================================
logging:
  level:
    com.inventory: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
